[package]
name = "xenstore-rs"
version = "0.8.0"
authors = [
    "Mathieu Tarral <mathieu.tarral@protonmail.com>",
    "Teddy Astie <teddy.astie@vates.tech>",
]
edition = "2018"
description = "Rust implementation of XenStore"
readme = "README.md"
homepage = "https://github.com/Wenzel/xenstore"
repository = "https://github.com/Wenzel/xenstore"
license = "GPL-3.0-only"
keywords = ["xen", "xenstore"]
categories = ["api-bindings"]

[dependencies]

# Async dependencies
[dependencies.trait-variant]
# See https://blog.rust-lang.org/2023/12/21/async-fn-rpit-in-traits.html
version = "0.1.2"
optional = true

[dependencies.futures]
version = "0.3.31"
features = ["write-all-vectored"]
optional = true

[dependencies.log] # Logging
version = "0.4"
optional = true

[dependencies.thiserror] # Error handling
version = "2.0.18"
optional = true

[dependencies.flume] # Used for mpsc channels as futures::mpsc needs &mut
version = "0.11.1"
features = ["async"]
optional = true

[dependencies.uuid] # Used for xenstore token generation/management
version = "1.11"
features = ["v4"]
optional = true

# Tokio implementation dependencies
[dependencies.tokio]
version = "1.0"
features = ["net", "io-util", "rt", "macros"]
optional = true

[dependencies.tokio-util] # Compatibility with futures's AsyncRead/Write
version = "0.7.13"
features = ["compat"]
optional = true

[dependencies.libc] # needed to O_NONBLOCK
version = "0.2.168"
optional = true

# Smol/async-std implementation dependencies
[dependencies.async-fs]
version = "2.1.2"
optional = true

[dependencies.async-io]
version = "2.4.0"
optional = true

[dependencies.async-net]
version = "2.0.0"
optional = true

[dependencies.async-executor]
version = "1.13.1"
optional = true

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
]

[dev-dependencies]
clap = { version = "4.1.4", features = ["derive"] }
colog = "1.3.0"
smol = "2.0.2"

[features]
default = ["unix"]
unix = []
async = ["futures", "trait-variant"]
async-generic = ["log", "async", "flume", "thiserror", "uuid"]
async-tokio = ["async-generic", "tokio", "tokio-util", "libc"]
async-smol = [
    "async-generic",
    "async-fs",
    "async-io",
    "async-net",
    "async-executor",
]
